name: CI

# Runs on every push/PR to main. This gate actually runs lint + the Jest
# suite + a Docker build against every change — none of these were wired up
# before (an earlier version of this workflow only ran `node --check`,
# a syntax check, and explicitly noted no test suite existed even though
# one did — see git history / audit notes). Anything failing here now
# blocks the merge; it doesn't just get logged and ignored.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Syntax-check frontend app.js
        run: node --check frontend/public/app.js

      - name: Run test suite
        run: npm test

      - name: npm audit (non-blocking — tracked separately via Dependabot)
        run: npm audit --omit=dev || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t india-in-time:ci-check .
