name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Syntax-check frontend
        run: node --check frontend/public/app.js
      - name: Frontend modular structure
        run: |
          test -f frontend/app-src/src/utils/experience-score.js
          test -f frontend/app-src/src/utils/travel-time.js
          test -f frontend/app-src/src/utils/sun-times.js
          test -f frontend/app-src/src/utils/stop-scoring.js
          test -f frontend/app-src/src/utils/travel-intel-ui.js
          test -f frontend/app-src/src/core/app.js
          test -f frontend/app-src/src/modules/index.js
          npm run build:frontend
          test -d frontend/public/dist/assets
      - name: Unit tests
        run: npm test
      - name: Security audit (high+)
        run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t india-in-time:ci-check .

  security-headers:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - name: Security middleware present
        run: |
          test -f middleware/security.js
          test -f SECURITY_AUDIT.md || test -f SECURITY_AUDIT.md
          node -e "require('./middleware/security')"
