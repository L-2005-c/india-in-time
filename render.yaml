services:
  - type: web
    name: trip-tastic-api
    env: docker
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trip-tastic-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: trip-tastic-db
    region: singapore
    plan: free
