services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: india_in_time_acceptance
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d india_in_time_acceptance"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/india_in_time_acceptance
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      REDIS_URL: redis://redis:6379
      REQUIRE_REDIS_IN_PROD: "false"
      CORS_ORIGIN: http://localhost:3000
      GEMINI_API_KEY: acceptance-test-key
      FIREBASE_SERVICE_ACCOUNT: "{}"
    ports: ["3000:3000"]
